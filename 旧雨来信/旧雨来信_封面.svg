<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18242b"/>
      <stop offset="0.48" stop-color="#20343b"/>
      <stop offset="1" stop-color="#0e1519"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="22%" r="48%">
      <stop offset="0" stop-color="#d9c39a" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#b99d73" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31444b"/>
      <stop offset="0.5" stop-color="#233238"/>
      <stop offset="1" stop-color="#182329"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="rain" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="12" y1="-20" x2="12" y2="62" stroke="#c7d5d8" stroke-opacity="0.16" stroke-width="1"/>
      <line x1="47" y1="-10" x2="47" y2="74" stroke="#c7d5d8" stroke-opacity="0.11" stroke-width="1"/>
      <line x1="78" y1="-28" x2="78" y2="54" stroke="#c7d5d8" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <pattern id="brick" width="120" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 0H120M0 70H120M0 35H120M0 0V35M60 35V70M120 0V35" fill="none" stroke="#52646b" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
    <style>
      .title { font-family: 'STSong', 'SimSun', 'Songti SC', serif; font-size: 104px; font-weight: 700; letter-spacing: 18px; fill: #f1e6d0; }
      .subtitle { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 28px; letter-spacing: 8px; fill: #cbbfa8; opacity: 0.92; }
      .author { font-family: 'STKaiti', 'KaiTi', serif; font-size: 34px; letter-spacing: 6px; fill: #e7d9c1; }
      .small { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-size: 21px; letter-spacing: 5px; fill: #aebdc0; opacity: 0.82; }
    </style>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#lamp)"/>
  <rect width="900" height="1200" fill="url(#rain)" opacity="0.9"/>

  <path d="M74 0H826L760 1200H140Z" fill="#1b272d" opacity="0.9"/>
  <path d="M96 0H424L378 1200H48Z" fill="url(#wall)" opacity="0.85"/>
  <path d="M476 0H804L852 1200H522Z" fill="url(#wall)" opacity="0.68"/>
  <rect x="96" y="0" width="328" height="1200" fill="url(#brick)" opacity="0.75"/>
  <rect x="476" y="0" width="328" height="1200" fill="url(#brick)" opacity="0.55"/>

  <path d="M150 925C240 880 332 858 450 858C568 858 660 880 750 925L820 1200H80Z" fill="#0b1115" opacity="0.72"/>
  <ellipse cx="450" cy="1010" rx="285" ry="52" fill="#d8c6a4" opacity="0.09"/>
  <ellipse cx="450" cy="1010" rx="210" ry="30" fill="#ffffff" opacity="0.06"/>

  <g filter="url(#paperShadow)" transform="translate(260 655) rotate(-4)">
    <path d="M0 0L342 22L320 250L-24 224Z" fill="#d8c5a3"/>
    <path d="M24 38L300 56" stroke="#8a755a" stroke-opacity="0.32" stroke-width="3"/>
    <path d="M18 86L292 104" stroke="#8a755a" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M14 132L286 150" stroke="#8a755a" stroke-opacity="0.18" stroke-width="2"/>
    <text x="102" y="158" font-family="STKaiti, KaiTi, serif" font-size="42" fill="#6b4435" opacity="0.72">眠眠</text>
    <path d="M-24 224L160 118L320 250" fill="none" stroke="#7b634b" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <g filter="url(#softShadow)" transform="translate(314 865)">
    <path d="M0 54Q0 22 34 18L246 0Q284 -3 292 36L312 134Q322 180 276 188L58 220Q16 226 9 184Z" fill="#5f1517"/>
    <path d="M0 54Q0 22 34 18L246 0Q284 -3 292 36L312 134Q322 180 276 188L58 220Q16 226 9 184Z" fill="#a82a2a" opacity="0.56"/>
    <path d="M22 60L286 32" stroke="#d36b5d" stroke-opacity="0.25" stroke-width="10"/>
    <path d="M46 182L282 150" stroke="#28090b" stroke-opacity="0.35" stroke-width="8"/>
    <rect x="132" y="84" width="56" height="52" rx="8" fill="#b28b55"/>
    <circle cx="160" cy="111" r="9" fill="#3a1f18"/>
  </g>

  <g opacity="0.28">
    <circle cx="145" cy="140" r="2" fill="#d9e3e2"/>
    <circle cx="728" cy="202" r="2" fill="#d9e3e2"/>
    <circle cx="680" cy="768" r="1.5" fill="#d9e3e2"/>
    <circle cx="198" cy="715" r="1.7" fill="#d9e3e2"/>
    <circle cx="808" cy="600" r="1.4" fill="#d9e3e2"/>
  </g>

  <text x="450" y="205" text-anchor="middle" class="small">现代关系悬疑 · 旧城雨夜</text>
  <text x="450" y="375" text-anchor="middle" class="title">旧雨</text>
  <text x="450" y="505" text-anchor="middle" class="title">来信</text>
  <line x1="270" y1="555" x2="630" y2="555" stroke="#d5c49f" stroke-opacity="0.55" stroke-width="2"/>
  <text x="450" y="608" text-anchor="middle" class="subtitle">墙中旧信，雨夜重启</text>
  <text x="450" y="1125" text-anchor="middle" class="author">桃枝醒醒 著</text>

  <rect x="22" y="22" width="856" height="1156" fill="none" stroke="#e3d4b8" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="38" y="38" width="824" height="1124" fill="none" stroke="#e3d4b8" stroke-opacity="0.12" stroke-width="1"/>
</svg>
