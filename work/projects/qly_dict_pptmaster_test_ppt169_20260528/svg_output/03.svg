<rect x="221.92" y="392.80" width="272.80" height="45.76" fill="#ffffff" stroke="none" stroke-width="0.20"/>
<rect x="221.92" y="589.92" width="272.80" height="67.36" fill="#ffffff" stroke="none" stroke-width="0.20"/>
<rect x="48.80" y="208.00" width="160.80" height="40.64" fill="#ffffff" stroke="none" stroke-width="0.20"/>
<rect x="48.80" y="405.60" width="160.80" height="40.64" fill="#ffffff" stroke="none" stroke-width="0.20"/>
<rect x="48.80" y="603.36" width="160.80" height="40.64" fill="#ffffff" stroke="none" stroke-width="0.20"/>
<rect x="48.80" y="306.88" width="160.80" height="40.64" fill="#ffffff" stroke="none" stroke-width="0.20"/>
