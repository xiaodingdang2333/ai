<text x="1245.23" y="712.11" font-family="Microsoft YaHei, Arial" font-size="12.00" font-weight="700" font-style="normal" fill="#808080" xml:space="preserve"><tspan font-size="12.00" fill="#808080" font-weight="700" font-style="normal">3</tspan></text>
<text x="74.15" y="63.18" font-family="Microsoft YaHei, Arial" font-size="26.73" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="26.73" fill="#ffffff" font-weight="700" font-style="normal">二、千里眼属地“集成装维类”服务包规划上架责任分工</tspan></text>
<text x="83.75" y="125.13" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="400" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="400" font-style="normal">•</tspan></text>
<text x="113.75" y="125.13" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">视频部负责统筹管理千里眼产品线DICT服务包，根据属地业务需求，由</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">产创中心负责属地“集成装维类”服务包规划设计</tspan></text>
<text x="83.75" y="158.73" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="400" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="400" font-style="normal">•</tspan></text>
<text x="113.75" y="158.73" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">上架阶段，产创中心负责需求立项上会、甄选属地合作伙伴，视频部负责评估上架需求、推进业支系统改造</tspan></text>
<text x="231.53" y="215.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点1：产创中心按需规划千里眼属地</tspan></text>
<text x="231.53" y="239.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">“集成装维类”服务包，提交视频部进行初</tspan></text>
<text x="231.53" y="263.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">审</tspan></text>
<text x="231.53" y="399.53" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点2：千里眼属地“集成装维类”服务</tspan></text>
<text x="231.53" y="423.53" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">包由产创中心立项上会，形成甄选方案，视</tspan></text>
<text x="231.53" y="447.53" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">频部及相关管理部门列席</tspan></text>
<text x="231.53" y="607.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点3：通过公司决策后，产创中心向视</tspan></text>
<text x="231.53" y="631.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">频部提交服务包上架需求，视频部统筹推进</tspan></text>
<text x="231.53" y="655.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">业支改造</tspan></text>
<text x="572.40" y="226.61" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">千里眼服务包总体规划原则：</tspan></text>
<text x="572.40" y="247.41" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、产创中心属地</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">“集成装维类”服务包仅可支撑属地化简单集成及属地装维类业务</tspan></text>
<text x="572.40" y="268.21" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">视频类核心产品</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">，如监控摄像头、视频存储设备等，属于视频部业务范围，客户有相关需求时，应优先使用视</tspan></text>
<text x="572.40" y="289.01" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">频部负责的服务包进行支撑，</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">视频部邮件明确无法支撑的产品需求，使用属地“集成装维类”服务包进行交付</tspan></text>
<text x="605.87" y="318.55" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">部门</tspan></text>
<text x="934.20" y="318.55" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">责任分工</tspan></text>
<text x="572.40" y="360.15" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">视频部</tspan></text>
<text x="685.20" y="352.15" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、评估</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">服务包规划是否符合千里眼产品线规划</tspan></text>
<text x="685.20" y="368.15" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、评估服务包规划业务范围是否超出规划原则限制</tspan></text>
<text x="572.40" y="421.61" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="685.20" y="405.61" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、结合本部门业务发展及与千里眼产品业务关系，规划本部门需要上架的“集成装维类”服</tspan></text>
<text x="685.20" y="421.61" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">务包</tspan></text>
<text x="685.20" y="437.61" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、与视频部沟通服务包业务规划合理性，视频部同意后方可进行后续工作推进</tspan></text>
<text x="572.40" y="507.30" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">服务包业支上架管理说明：</tspan></text>
<text x="572.40" y="528.10" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">因集团</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">IT</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">需求管理变更，目前还未明确千里眼产品需求管理流程，各部门需提前计划报备上架需求，待流程确定</tspan></text>
<text x="572.40" y="548.90" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">后，视频部将进一步明确相关机制流程</tspan></text>
<text x="605.87" y="575.37" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">部门</tspan></text>
<text x="934.20" y="575.37" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">责任分工</tspan></text>
<text x="572.40" y="612.63" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">视频部</tspan></text>
<text x="685.20" y="602.97" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">、收集各部门潜在服务包上架需求；</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">向集团汇报千里眼服务包上架规划</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">，沟通相关流程；</tspan></text>
<text x="685.20" y="618.97" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">、评估服务包上架时间，跟进服务包上架进度。</tspan></text>
<text x="572.40" y="657.50" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="685.20" y="647.90" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">、提前规划服务包上架需求，上报视频部；</tspan></text>
<text x="685.20" y="663.90" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">、配合视频部向集团大视频部汇报服务包上架需求，准备上架相关材料；</tspan></text>
<text x="82.47" y="232.80" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">服务包规划设计</tspan></text>
<text x="82.47" y="430.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">服务包甄选决策</tspan></text>
<text x="102.47" y="628.20" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">业支改造</tspan></text>
<text x="62.53" y="331.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">市场部等职能部门审核</tspan></text>
<text x="62.53" y="521.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">甄选结果及上架需求上</tspan></text>
<text x="69.20" y="537.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">报集团政企管理部门</tspan></text>
</svg>
