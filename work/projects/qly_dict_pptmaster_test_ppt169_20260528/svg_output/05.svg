<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<image x="0" y="0" width="1280" height="720" href="../images/page_05_background.png"/>
<rect x="403.84" y="343.36" width="473.92" height="45.12" fill="#008bff" stroke="none" stroke-width="0.20"/>
<text x="1245.23" y="712.11" font-family="Microsoft YaHei, Arial" font-size="12.00" font-weight="700" font-style="normal" fill="#808080" xml:space="preserve"><tspan font-size="12.00" fill="#808080" font-weight="700" font-style="normal">5</tspan></text>
<text x="74.15" y="63.18" font-family="Microsoft YaHei, Arial" font-size="26.73" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="26.73" fill="#ffffff" font-weight="700" font-style="normal">四、千里眼属地“集成装维类”服务包执行方案</tspan></text>
<text x="27.67" y="116.47" font-family="Microsoft YaHei, Arial" font-size="21.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="21.27" fill="#008cff" font-weight="700" font-style="normal">背景说明：</tspan></text>
<text x="48.67" y="146.73" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">①26年1月完成</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">首批25个“产品定制类”服务包</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">立项，已于3月下旬完成集客大厅上架，</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">目前已开放订购</tspan></text>
<text x="48.67" y="175.53" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">②26年3月31日，数智安防等</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">2025年及之前上架的21个存量服务包已冻结</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">，自3月31日起</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">暂停订购</tspan></text>
<text x="48.67" y="204.33" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">③以上46个服务包均已沟通</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">省侧签署结算合同</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">，目前已完成20省签约，其他省份已立项</tspan></text>
<text x="27.67" y="249.67" font-family="Microsoft YaHei, Arial" font-size="21.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="21.27" fill="#008cff" font-weight="700" font-style="normal">存在问题：</tspan></text>
<text x="48.67" y="279.93" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">①产创中心新规划属地“集成装维类”服务包，甄选合作伙伴并进行资费上架，因目前</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">业支系统改造困难，新服务包上架预计耗时3-4个月</tspan></text>
<text x="48.67" y="308.73" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">②属地</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">新服务包上架</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">，</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">需产创中心沟通省公司签署结算补充协议</tspan><tspan font-size="16.00" fill="#000000" font-weight="400" font-style="normal">，</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">将新服务包资费纳入结算合同后方可发展业务，预计耗时3个月</tspan></text>
<text x="480.80" y="373.07" font-family="Microsoft YaHei, Arial" font-size="21.27" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="21.27" fill="#ffffff" font-weight="700" font-style="normal">建议：设置千里眼存量包划转方案</tspan></text>
<text x="63.27" y="516.33" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">1、产创中心提交属地服务包规划，</tspan><tspan font-size="14.73" fill="#c00000" font-weight="700" font-style="normal">划转千里眼存量包</tspan><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">；视频部审核；</tspan></text>
<text x="63.27" y="542.73" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">2、产创中心上会决策</tspan><tspan font-size="14.73" fill="#c00000" font-weight="700" font-style="normal">甄选属地合作伙伴</tspan><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">；视频部列席；</tspan></text>
<text x="63.27" y="569.13" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">3、产创中心甄选属地合作伙伴，签约引入；</tspan></text>
<text x="63.27" y="595.53" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">4、视频部负责配置集客大厅属地合作伙伴账号；</tspan></text>
<text x="311.87" y="449.80" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">方案一</tspan></text>
<text x="914.13" y="449.80" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">方案二</tspan></text>
<text x="95.00" y="481.27" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">产创中心上会决策，</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">划转存量服务包资费</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">，甄选属地合作伙伴支撑业务</tspan></text>
<text x="682.13" y="481.27" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">产创中心上会决策，</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">划转存量服务包资费，划转存量服务包剩余合同额度</tspan></text>
<text x="279.67" y="620.73" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="14.73" fill="#c00000" font-weight="700" font-style="normal">预计耗时：2个月</tspan></text>
<text x="665.20" y="516.33" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">1、产创中心提交属地服务包规划，</tspan><tspan font-size="14.73" fill="#c00000" font-weight="700" font-style="normal">划转千里眼存量包</tspan><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">；视频部审核；</tspan></text>
<text x="665.20" y="542.73" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">2、产创中心上会决策</tspan><tspan font-size="14.73" fill="#c00000" font-weight="700" font-style="normal">划转存量服务包剩余合同额度（相关物料同步划转至产创中心）</tspan><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">；</tspan></text>
<text x="665.20" y="569.13" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="14.73" fill="#000000" font-weight="400" font-style="normal">视频部列席；</tspan></text>
<text x="889.07" y="616.47" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="14.73" fill="#c00000" font-weight="700" font-style="normal">预计耗时：1个月</tspan></text>
<text x="53.40" y="421.13" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">产创中心可根据属地供应商的情况选择方案一或者方案二开展存量服务包划转工作；划转后，主体责任同步划转给产创中心，视频部负管理责任</tspan></text>
<text x="275.27" y="663.60" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">因集团暂停受理IT改造需求，存量包划转初期，新订单由视频部代产创中心接单，业务责任归属产创中心，视频部负管理责任</tspan></text>
<text x="181.20" y="687.60" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">视频部负责完成存量服务包在途订单的闭环并负业务责任；在途订单：省侧前期已下单或能提供早于26年3月31日的省客合同或决策纪要，且由视频部接单的</tspan></text>
</svg>
