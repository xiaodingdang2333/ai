<text x="48.73" y="529.27" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">②支撑内部合同划转和物料划转（负责沟通数智化部）</tspan></text>
