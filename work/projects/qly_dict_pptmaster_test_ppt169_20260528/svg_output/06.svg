<text x="48.67" y="217.87" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">③组建属地服务包团队，对于订单审核、交付管理、供应链支付环节配置专业人员</tspan></text>
<text x="27.67" y="286.94" font-family="Microsoft YaHei, Arial" font-size="24.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="24.00" fill="#008cff" font-weight="700" font-style="normal">视频部：</tspan></text>
<text x="48.67" y="317.20" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">①支撑产创中心</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">属地服务包规划，做好存量服务包划转计划</tspan></text>
<text x="48.67" y="350.80" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">②完成在途项目闭环</tspan></text>
<text x="48.67" y="384.40" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">③支撑产创中心相关业支系统账号配置，按需推动业支系统改造</tspan></text>
<text x="27.73" y="465.40" font-family="Microsoft YaHei, Arial" font-size="24.00" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="24.00" fill="#008cff" font-weight="700" font-style="normal">市场运营部：</tspan></text>
