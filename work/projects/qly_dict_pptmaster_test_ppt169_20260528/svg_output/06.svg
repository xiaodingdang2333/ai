<text x="48.67" y="150.67" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">①26年6月中旬前</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">按需完成属地服务包需求</tspan><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">立项，6月底前完成上会决策</tspan></text>
