<text x="1245.23" y="712.11" font-family="Microsoft YaHei, Arial" font-size="12.00" font-weight="700" font-style="normal" fill="#808080" xml:space="preserve"><tspan font-size="12.00" fill="#808080" font-weight="700" font-style="normal">4</tspan></text>
<text x="74.15" y="63.18" font-family="Microsoft YaHei, Arial" font-size="26.73" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="26.73" fill="#ffffff" font-weight="700" font-style="normal">三、千里眼属地“集成装维类”服务包业务交付责任分工</tspan></text>
<text x="63.14" y="123.13" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="400" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="400" font-style="normal">•</tspan></text>
<text x="93.14" y="123.13" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">产创中心负责属地</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">“集成装维类”服务包的业务真实性</tspan><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">，完成售前沟通及项目交付；视频部</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">负管理职责</tspan></text>
<text x="63.14" y="156.73" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="400" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="400" font-style="normal">•</tspan></text>
<text x="93.14" y="156.73" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">视频部作为千里眼产品线管理部门，负责属地DICT服务包</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">交付确认审核，计入订单产品收入</tspan></text>
<text x="243.00" y="205.13" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点1：通过“四个自主”标准实现</tspan></text>
<text x="243.00" y="229.13" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">融能的项目，产创中心按DICT项目管</tspan></text>
<text x="243.00" y="253.13" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">理要求执行，发起项目预决策</tspan></text>
<text x="238.93" y="314.87" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点2：产创中心自行完成属地“集</tspan></text>
<text x="238.93" y="338.87" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">成装维类”服务包接单审核</tspan></text>
<text x="531.00" y="209.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">部门</tspan></text>
<text x="896.07" y="209.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="700" font-style="normal">责任分工</tspan></text>
<text x="517.67" y="251.07" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="616.40" y="235.07" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">对业务真实性负责</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">，搜集项目信息，包括交付实质内容、客户交付要求、服务包业务订购计划等，保</tspan></text>
<text x="616.40" y="251.07" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">证业务符合公司业务管理要求</tspan></text>
<text x="616.40" y="267.07" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、通过“四个自主”标准实现融能的项目，</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">在售前阶段按DICT项目管理要求执行，发起项目预决策</tspan></text>
<text x="517.70" y="435.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="616.57" y="427.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、完成订单录入、选择物料进行报价封装、销售订单审批</tspan></text>
<text x="616.57" y="443.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">发起甄选委托单，完成甄选委托单审批</tspan></text>
<text x="241.53" y="519.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点4：产创中心全面负责属地“集</tspan></text>
<text x="241.53" y="543.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">成装维类”服务包交付阶段，组织项</tspan></text>
<text x="241.53" y="567.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">目交付</tspan></text>
<text x="517.63" y="523.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="616.37" y="515.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">属地“集成装维类”服务包业务由产创中心全面支撑，负责组织合作伙伴交付</tspan></text>
<text x="616.37" y="531.67" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、交付完成后，对交付过程材料、验收材料进行审核，在交付确认环节审批</tspan></text>
<text x="524.30" y="565.27" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">视频部</tspan></text>
<text x="616.37" y="557.27" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、在产创中心审批后，视频部</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">对交付过程材料、验收材料进行审核，并在集客大厅完成交付确认审批</tspan></text>
<text x="616.37" y="573.27" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">（若遇特殊情况，材料未及时反馈，订单需要视频部审核，需产创中心一把手邮件确认）</tspan></text>
<text x="517.67" y="650.13" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="616.40" y="650.13" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、在系统提交项目材料，</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">发起订单计收</tspan><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">，对业务真实性及交付材料真实性负责</tspan></text>
<text x="517.70" y="347.27" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">产创中心</tspan></text>
<text x="616.57" y="339.27" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、核实业务订单信息与材料，需与售前沟通情况保持一致</tspan></text>
<text x="616.57" y="355.27" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、根据订单情况对服务包进行额度分配，</tspan><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">审核项目内容并接单</tspan></text>
<text x="238.93" y="421.93" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点3：产创中心发起属地“集成装</tspan></text>
<text x="238.93" y="445.93" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">维类”服务包甄选委托单</tspan></text>
<text x="122.20" y="214.00" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">售前沟通</tspan></text>
<text x="108.87" y="321.56" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">集客大厅接单</tspan></text>
<text x="135.53" y="644.25" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">计收</tspan></text>
<text x="122.20" y="536.69" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">项目交付</tspan></text>
<text x="82.27" y="429.13" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">市场销售支撑系统下单</tspan></text>
<text x="241.00" y="638.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">差异点5：产创中心对属地“集成装维</tspan></text>
<text x="241.00" y="662.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">类”服务包项目交付过程材料负责</tspan></text>
</svg>
