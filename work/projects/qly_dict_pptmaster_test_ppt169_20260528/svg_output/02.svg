<text x="1245.23" y="712.11" font-family="Microsoft YaHei, Arial" font-size="12.00" font-weight="700" font-style="normal" fill="#808080" xml:space="preserve"><tspan font-size="12.00" fill="#808080" font-weight="700" font-style="normal">2</tspan></text>
<text x="74.15" y="63.18" font-family="Microsoft YaHei, Arial" font-size="26.73" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="26.73" fill="#ffffff" font-weight="700" font-style="normal">一、服务包分类管理，产品部门与产创中心按需规划建设</tspan></text>
<text x="34.67" y="119.66" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="400" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="400" font-style="normal">•</tspan></text>
<text x="61.13" y="119.66" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">公司内部对服务包细化管理，分成</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">“产品定制类”和“集成装维类”两类</tspan><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">，由各产品部门、产创中心共同参与服务包立项建设</tspan></text>
<text x="34.67" y="153.26" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="400" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="18.73" fill="#c00000" font-weight="400" font-style="normal">•</tspan></text>
<text x="61.13" y="153.26" font-family="Microsoft YaHei, Arial" font-size="18.73" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">“产品定制类”</tspan><tspan font-size="18.73" fill="#008cff" font-weight="700" font-style="normal">服务包明确场景、明确应用，按行业产品功能形态、应用场景分类设计资费条目；</tspan><tspan font-size="18.73" fill="#c00000" font-weight="700" font-style="normal">“集成装维类”服务包继续使用通用性资费条目</tspan></text>
<text x="143.73" y="276.80" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、自研类产品</tspan></text>
<text x="143.73" y="300.80" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、融能生态产品</tspan></text>
<text x="143.73" y="324.80" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">3、行业场景化标准方案产品</tspan></text>
<text x="143.73" y="348.80" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">4、主流行业云化/入驻式标杆项目</tspan></text>
<text x="143.67" y="472.73" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、属地化简单集成项目</tspan></text>
<text x="143.67" y="496.73" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、属地化运维类项目</tspan></text>
<text x="143.67" y="520.73" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">3、属地化装维类项目</tspan></text>
<text x="143.67" y="544.73" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">4、属地化简单定制开发项目</tspan></text>
<text x="48.90" y="307.68" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">产品定制类</tspan></text>
<text x="48.90" y="504.09" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">集成装维类</tspan></text>
<text x="263.20" y="188.05" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="16.00" fill="#ffffff" font-weight="700" font-style="normal">服务包分类发展</tspan></text>
<text x="887.68" y="188.05" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="700" font-style="normal" fill="#ffffff" xml:space="preserve"><tspan font-size="16.00" fill="#ffffff" font-weight="700" font-style="normal">服务包业务融能标准</tspan></text>
<text x="28.99" y="625.35" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="400" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="16.00" fill="#c00000" font-weight="400" font-style="normal">•</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal"> </tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">产品部门</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">主要</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">发展“产品定制类”服务包，</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">打造符合融能规范的标准化产品，按需通过“集成装维类”服务包支撑装维、集成类项目</tspan></text>
<text x="28.99" y="654.15" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="400" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="16.00" fill="#c00000" font-weight="400" font-style="normal">•</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal"> </tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">产创中心仅支持按需规划属地“集成装维类”服务包，</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">支撑交付属地装维、属地简单集成交付的项目</tspan></text>
<text x="28.99" y="682.95" font-family="Microsoft YaHei, Arial" font-size="16.00" font-weight="400" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="16.00" fill="#008cff" font-weight="400" font-style="normal">•</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal"> </tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">原则上DICT服务包</tspan><tspan font-size="16.00" fill="#c00000" font-weight="700" font-style="normal">谁规划设计，谁负责</tspan><tspan font-size="16.00" fill="#008cff" font-weight="700" font-style="normal">；产品线主责部门对全量服务包负管理责任（如：千里眼产品线服务包，视频部均负管理责任）</tspan></text>
<text x="48.96" y="223.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">服务包分类</tspan></text>
<text x="222.77" y="223.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">业务范围</tspan></text>
<text x="479.47" y="223.40" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">资费设计</tspan></text>
<text x="384.80" y="267.67" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="700" font-style="normal">服务包</tspan></text>
<text x="514.93" y="267.67" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="700" font-style="normal">条目</tspan></text>
<text x="380.13" y="340.47" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺</tspan></text>
<text x="477.60" y="288.47" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺无人看店服务</tspan></text>
<text x="477.60" y="309.27" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺安全消防服务</tspan></text>
<text x="486.93" y="330.07" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺客流服务</tspan></text>
<text x="477.60" y="350.87" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺人脸识别服务</tspan></text>
<text x="472.93" y="371.67" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺平台定制化服务</tspan></text>
<text x="468.27" y="392.47" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">沿街商铺平台终端接入调试</tspan></text>
<text x="384.97" y="476.88" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="700" font-style="normal">服务包</tspan></text>
<text x="515.10" y="476.88" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="700" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="700" font-style="normal">条目</tspan></text>
<text x="375.63" y="523.28" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">泛视频安防</tspan></text>
<text x="473.10" y="497.68" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">泛视频安防平台入驻部署</tspan></text>
<text x="468.43" y="518.48" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">泛视频安防平台的定制开发</tspan></text>
<text x="445.10" y="539.28" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">泛视频安防客户侧系统的对接集成开发</tspan></text>
<text x="463.77" y="560.08" font-family="Microsoft YaHei, Arial" font-size="9.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="9.27" fill="#000000" font-weight="400" font-style="normal">泛视频安防平台终端接入调试</tspan></text>
<text x="368.20" y="242.53" font-family="Microsoft YaHei, Arial" font-size="10.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="10.73" fill="#000000" font-weight="400" font-style="normal">主要按行业产品功能形态、应用场景分类设计资费条目</tspan></text>
<text x="373.29" y="453.57" font-family="Microsoft YaHei, Arial" font-size="10.73" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="10.73" fill="#000000" font-weight="400" font-style="normal">延用系统集成、部署等通用资费条目</tspan></text>
<text x="857.27" y="229.08" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="14.73" fill="#008cff" font-weight="700" font-style="normal">标准一：标准化服务/DICT项目</tspan></text>
<text x="696.73" y="258.35" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、生态硬件融合 AIoT 平台或自有 SaaS 能力：设备接入率不得低于10%</tspan></text>
<text x="696.73" y="282.35" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、生态硬件融合自研芯片、模组产品</tspan></text>
<text x="696.73" y="306.35" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">3、使用自研产品：自研产品金额占比不得低于5%</tspan></text>
<text x="897.40" y="341.88" font-family="Microsoft YaHei, Arial" font-size="14.73" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="14.73" fill="#008cff" font-weight="700" font-style="normal">标准二：DICT项目</tspan></text>
<text x="696.73" y="380.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">1、自主集成：我司作为总集成方中标/支撑项目</tspan></text>
<text x="696.73" y="404.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">2、自主交付：参照《中移物联网有限公司 DICT 项目关键文档清单》</tspan></text>
<text x="696.73" y="428.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">3、自主研发：体现自有或自控团队负责研发工作</tspan></text>
<text x="696.73" y="452.47" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#000000" xml:space="preserve"><tspan font-size="13.27" fill="#000000" font-weight="400" font-style="normal">4、自主运维：体现自有或自控团队负责运维运营工作</tspan></text>
<text x="660.40" y="496.50" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="400" font-style="normal">•</tspan></text>
<text x="678.40" y="496.50" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">“产品定制类”服务包，</tspan><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">主要按照标准一支撑省侧接入核心平台的融能产品项目；若前向为DICT</tspan></text>
<text x="678.40" y="520.50" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#008cff" xml:space="preserve"><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">项目，可按标准二“四个自主”方式满足融能要求；</tspan></text>
<text x="660.40" y="544.50" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="400" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="400" font-style="normal">•</tspan></text>
<text x="678.40" y="544.50" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">“集成装维类”服务包，</tspan><tspan font-size="13.27" fill="#008cff" font-weight="700" font-style="normal">支撑集成和装维类项目，按标准二“四个自主”方式满足融能要求；</tspan></text>
<text x="48.96" y="429.64" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">服务包分类</tspan></text>
<text x="222.77" y="429.64" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">业务范围</tspan></text>
<text x="477.79" y="429.64" font-family="Microsoft YaHei, Arial" font-size="13.27" font-weight="700" font-style="normal" fill="#c00000" xml:space="preserve"><tspan font-size="13.27" fill="#c00000" font-weight="700" font-style="normal">资费设计</tspan></text>
