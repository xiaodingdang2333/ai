name: trigger-remove-migrated-qiling

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run remove-migrated-qiling-audio-appraisal.yml --repo "${{ github.repository }}" --ref main
