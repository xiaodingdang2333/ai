name: Build SheetMusic Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, "codex/**" ]
    paths:
      - "work/sheetmusic_android/**"
      - ".github/workflows/sheetmusic-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/sheetmusic_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: sheetmusic-assistant-debug-apk
          path: work/sheetmusic_android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheetmusic-build-log
          path: work/sheetmusic_android/build.log
